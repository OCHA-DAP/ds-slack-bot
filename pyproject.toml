[project]
name = "dsci-slack-bot"
version = "0.1.0"
requires-python = "==3.10.*"
description = "Data Science Team Slack notifications"
authors = [{name = "Hannah", email = "hannah.ker@un.org"}] 
dependencies = [
    "python-dotenv",
    "slack-sdk>=3.39.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pre-commit",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pre-commit",
]

[tool.ruff]
line-length = 88
target-version = "py38"
exclude = ["examples/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
